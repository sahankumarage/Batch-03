<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar | Modern Web Experience</title>
    <!-- Use Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Link to our CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Meta description for SEO -->
    <meta name="description" content="Experience the perfect harmony of aesthetics and performance with Stellar modern web development solutions.">
</head>
<body>
    <!-- Background animated blobs -->
    <div class="blob-c">
        <div class="shape blob1"></div>
        <div class="shape blob2"></div>
        <div class="shape blob3"></div>
    </div>
    
    <!-- Navigation bar -->
    <nav class="navbar glass">
        <div class="logo">Stellar.</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#features">Features</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <button class="btn-primary" id="theme-toggle">Light Mode</button>
    </nav>

    <!-- Main hero section -->
    <main class="hero" id="home">
        <div class="hero-content glass" id="hero-box">
            <h1>Elevate Your Digital <span class="gradient-text">Presence</span></h1>
            <p>Experience the perfect harmony of aesthetics and performance with our modern web development solutions.</p>
            <div class="cta-buttons">
                <button class="btn-primary">Get Started</button>
                <button class="btn-secondary">View Portfolio</button>
            </div>
        </div>
    </main>

    <!-- Link to our JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
